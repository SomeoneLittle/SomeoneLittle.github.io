<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SomeoneLittle</title>
  <style>
    :root {
      --bg: #0b0d0e;
      --card: #171c1e;
      --line: #263033;
      --text: #e6edeb;
      --muted: #8a9794;
      --accent: #2dd4a7;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    main { width: 100%; max-width: 560px; }
    h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    p.lead { color: var(--muted); margin: 0 0 32px; }
    .list { display: grid; gap: 14px; }
    a.site {
      display: block;
      padding: 20px 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    a.site:hover, a.site:focus-visible {
      border-color: var(--accent);
      transform: translateY(-2px);
      outline: none;
    }
    a.site strong { display: block; color: var(--accent); font-size: 1.15rem; margin-bottom: 4px; }
    a.site span { color: var(--muted); font-size: .95rem; }
    @media (prefers-reduced-motion: reduce) {
      a.site { transition: none; }
      a.site:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Мои сайты</h1>
    <p class="lead">Выбери, куда перейти.</p>
    <div class="list">
      <a class="site" href="/tech3dmodelshop/">
        <strong>tech3dmodelshop</strong>
        <span>Магазин 3D-моделей</span>
      </a>
      <a class="site" href="/backupplace/">
        <strong>backupplace</strong>
        <span>Второй сайт</span>
      </a>
    </div>
  </main>
</body>
</html>
